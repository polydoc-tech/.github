name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Daily: a repo that has no caller job of its own, or pushes past it, still shows up here
  # within a day.
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A scheduled run on main must not cancel a push run on main, or the reverse.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  public-scrub:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Test the check
        run: node --test scripts/check-public-scrub.test.mjs

      # Forks are left out: their content is upstream's, not ours. This step and the next
      # run even when the tests fail, so a red test cannot hide a finding in another repo.
      - name: Clone every repo this account owns
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate '/users/polydoc-tech/repos?per_page=100' \
            --jq '.[] | select((.archived or .fork) | not) | .name' | grep -vx '.github' > own.txt
          test -s own.txt
          mkdir -p own
          while read -r repo; do
            git clone --depth 1 --quiet "https://github.com/polydoc-tech/$repo.git" "own/$repo"
          done < own.txt
          echo "cloned $(wc -l < own.txt) repositories"

      - name: No internal file, local path or private link in any of them
        if: ${{ !cancelled() }}
        run: node scripts/check-public-scrub.mjs . own/*

  # Proves the workflow other repos call, on this repo, before any of them depends on it.
  public-scrub-caller:
    uses: ./.github/workflows/public-scrub.yml
    with:
      source-ref: ${{ github.event.pull_request.head.sha || github.sha }}
